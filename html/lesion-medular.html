<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesión medular - FisioEVAL</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="app-body" data-lesion="medular">

    <main class="screen">

        <!-- COMPONENTE: AppHeader con botón de regreso -->
        <header class="app-header">
            <a href="index.html" class="btn-back" aria-label="Volver a Consulta de lesiones">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
            </a>
            <h1>Lesión medular</h1>
        </header>

        <!-- COMPONENTE: Buscador -->
        <div class="search-bar-container">
            <label class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/></svg>
                <input type="search" class="search-input" placeholder="Busca un área..." aria-label="Buscar área" data-search="lista-areas">
            </label>
        </div>

        <!-- LISTA DE ÁREAS DE EVALUACIÓN (Card Button Bullets) -->
        <nav class="card-list" id="lista-areas" aria-label="Áreas de evaluación">

            <!-- 1. Área cognitiva (fuera del alcance del módulo AVD) -->
            <a href="#" data-coming-soon="Área cognitiva" class="card-button">
                <div class="card-icon"><img src="../assets/lesionEncefalica/imageBrain.png" alt=""></div>
                <div class="card-content">
                    <h2 class="card-title">Área cognitiva</h2>
                    <ul class="card-bullets">
                        <li>Funciones cognitivas básicas</li>
                        <li>Funciones cognitivas superiores</li>
                        <li>Evaluación de funciones frontales</li>
                        <li>Conciencia</li>
                    </ul>
                </div>
                <span class="card-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
            </a>
            <!-- 2. Actividades de la vida diaria (módulo AVD de nuestro equipo) -->
            <a href="menu-avd-medular.html" class="card-button">
                <div class="card-icon"><img src="../assets/lesionEncefalica/imagePhysique.png" alt=""></div>
                <div class="card-content">
                    <h2 class="card-title">Actividades de la vida diaria</h2>
                    <ul class="card-bullets">
                        <li>Básicas</li>
                        <li>Instrumentales</li>
                    </ul>
                </div>
                <span class="card-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
            </a>
        </nav>

        <p class="empty-state" data-empty-for="lista-areas">No hay áreas que coincidan con tu búsqueda.</p>
    </main>

    <script src="../js/app.js"></script>
</body>
</html>
