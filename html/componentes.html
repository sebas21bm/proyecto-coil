<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librería de Componentes - NeuroEval</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body style="background-color: var(--color-surface); padding: 24px;">

    <h2>Guía de Componentes Reutilizables</h2>
    <hr style="margin-bottom: 24px;">

    <!-- COMPONENTE: Breadcrumb -->
    <div style="margin-bottom: 24px;">
        <div class="breadcrumb">
            <span>Nivel 1</span> &gt;
            <span>Nivel 2</span> &gt;
            <span class="active">Nivel 3</span>
        </div>
    </div>

    <!-- COMPONENTE: Buscador con Filtro -->
    <div class="search-bar-container">
        <div style="position: relative; flex: 1;">
            <span style="position: absolute; left: 12px; top: 12px;">🔍</span>
            <input type="text" class="search-input" placeholder="Texto ...">
        </div>
        <!-- Botón de filtro morado/azul de tu diseño -->
        <button class="btn-filter">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
        </button>
    </div>

    <!-- COMPONENTE: Card Button Simple (Con descripción) -->
    <a href="#" class="card-button">
        <div class="card-icon">🧠</div>
        <div class="card-content">
            <h3 class="card-title">Título</h3>
            <p class="card-desc">Descripción</p>
        </div>
        <div style="color: var(--color-primary); font-weight: bold;">›</div>
    </a>

    <!-- COMPONENTE: Card Button Bullets (Con viñetas) -->
    <a href="#" class="card-button">
        <div class="card-icon">🧠</div>
        <div class="card-content">
            <h3 class="card-title">Título</h3>
            <ul class="card-bullets">
                <li>Item 1</li>
                <li>Item 2</li>
                <li>Item 3</li>
            </ul>
        </div>
        <div style="color: var(--color-primary); font-weight: bold;">›</div>
    </a>

</body>
</html>
