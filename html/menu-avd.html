<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menú General AVD - NeuroEval</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body style="background-color: var(--color-surface); padding: var(--space-16);">

    <header style="margin-bottom: var(--space-24);">
        <!-- COMPONENTE: Breadcrumb -->
        <div class="breadcrumb">
            <a href="index.html" style="color: var(--color-muted); text-decoration: none;">Inicio</a> &gt;
            <a href="lesion-encefalica.html" style="color: var(--color-muted); text-decoration: none;">Lesión encefálica</a> &gt;
            <span class="active">AVD</span>
        </div>
        
        <div style="display: flex; align-items: center; margin-top: var(--space-8);">
            <!-- <a href="lesion-encefalica.html" style="text-decoration: none; font-size: 24px; color: var(--color-ink); margin-right: 12px;">←</a> -->
            <a href="lesion-encefalica.html" style="text-decoration: none; margin-right: 12px; display: flex; align-items: center;">
                <img src="../assets/lesionEncefalica/iconBack.png" alt="Volver" style="width: 14px; height: 14px; object-fit: contain;">
            </a>
            <h1 style="font-size: 24px; font-weight: 800; color: var(--color-ink); margin: 0;">Actividades de la vida diaria</h1>
        </div>
        <p style="font-size: 14px; color: var(--color-muted); margin-top: 8px;">
            Seleccione la categoría de evaluación para el paciente.
        </p>
    </header>

    <main>
        <!-- COMPONENTE: Buscador con Filtro -->
        <!-- Resuelve la necesidad de agilizar la búsqueda y selección de una evaluación en específico -->
        <div class="search-bar-container">
            <div style="position: relative; flex: 1;">
                <span style="position: absolute; left: 12px; top: 12px; color: var(--color-muted);">🔍</span>
                <input type="text" class="search-input" placeholder="Buscar pauta o escala...">
            </div>
            <button class="btn-filter" aria-label="Filtrar evaluaciones">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
            </button>
        </div>

        <!-- COMPONENTE: Card Button Bullets (Categoría AVD Básicas) -->
        <a href="avd-basicas.html" class="card-button">
            <div class="card-icon">🚶</div>
            <div class="card-content">
                <h2 class="card-title">AVD Básicas</h2>
                <ul class="card-bullets">
                    <li>Índice de Barthel</li>
                    <li>Escala FIM</li>
                </ul>
            </div>
            <div style="color: var(--color-primary); font-weight: bold; font-size: 20px;">›</div>
        </a>

        <!-- COMPONENTE: Card Button Bullets (Categoría AVD Instrumentales) -->
        <a href="avd-instrumentales.html" class="card-button">
            <div class="card-icon">🛒</div>
            <div class="card-content">
                <h2 class="card-title">AVD Instrumentales</h2>
                <ul class="card-bullets">
                    <li>Escala de Lawton/Brody</li>
                    <li>Pauta Hernández Neuman</li>
                </ul>
            </div>
            <div style="color: var(--color-primary); font-weight: bold; font-size: 20px;">›</div>
        </a>
    </main>

</body>
</html>
