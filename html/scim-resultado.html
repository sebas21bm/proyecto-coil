<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado - SCIM III - NeuroEval</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="app-body">
    <main class="screen screen--avd" data-result="scim">
        <!-- COMPONENTE: Encabezado / Volver -->
        <header class="app-header app-header--dark">
            <a href="scim-evaluacion.html" class="btn-back" aria-label="Volver al formulario">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
            </a>
            <h1>Resultado de la evaluación</h1>
        </header>

        <h2 class="page-title">SCIM III</h2>
        <section class="result-card result-card--scores">
            <p class="result-label">Puntuación total</p>
            <p class="result-total" data-total>0</p>
            <p class="result-range">de 100 puntos</p>
            <p class="subscore-label">Autocuidado · de 20 puntos</p>
            <p class="subscore-value" data-subtotal="selfcare">0</p>
            <p class="subscore-label">Respiración y esfínteres · de 40 puntos</p>
            <p class="subscore-value" data-subtotal="resp">0</p>
            <p class="subscore-label">Movilidad · de 40 puntos</p>
            <p class="subscore-value" data-subtotal="mob">0</p>
        </section>

        <div class="result-actions">
            <a href="scim-evaluacion.html" class="btn-block btn-primary">Revisar respuestas</a>
            <a href="avd-basicas-medular.html" class="btn-block btn-outline" data-back-list>Volver a instrumentos</a>
        </div>
    </main>

    <script src="../js/escalas.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
